# Serve Homeoffice through a Cloudflare Tunnel instead of Caddy: no open ports, and Cloudflare
# provides HTTPS. Create the tunnel in the Cloudflare dashboard (Networking > Tunnels) and add a
# published application route from your hostname to http://app:3001. Then add to .env:
#
#   CLOUDFLARE_TUNNEL_TOKEN=<the tunnel's token>
#   COMPOSE_FILE=docker-compose.yml:deploy/cloudflare-tunnel.yml
#   DOMAIN=<your hostname>
#
# and use plain `docker compose up -d --build` (COMPOSE_FILE makes every compose command include
# this file). If Caddy was running, `docker compose down` first, before setting COMPOSE_FILE.
services:
  caddy:
    profiles: ["caddy"] # Not needed: the tunnel replaces it.

  app:
    environment:
      CLIENT_IP_HEADER: cf-connecting-ip

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - app
