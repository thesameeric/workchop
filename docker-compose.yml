# Workchop with Postgres and automatic HTTPS (Caddy).
#
#   cp .env.example .env    # then set DOMAIN and POSTGRES_PASSWORD
#   docker compose up -d --build
#
# Optional TURN relay for people behind strict firewalls:
#   docker compose --profile turn up -d --build

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://workchop:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/workchop
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      ICE_SERVERS: ${ICE_SERVERS:-}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_KEY_API_TOKEN: ${CLOUDFLARE_TURN_KEY_API_TOKEN:-}
      CLOUDFLARE_TURN_TTL: ${CLOUDFLARE_TURN_TTL:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-}
      # Weather: a paid Open-Meteo key for commercial use, or WEATHER=off.
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
      WEATHER: ${WEATHER:-}
      # The address people open Workchop at (sign-in redirects are built from it).
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN:?Set DOMAIN in .env}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      # GitHub sign-in and notifications: the OAuth App, and the key that encrypts saved GitHub tokens
      # (notifications only).
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      # Uploaded files go into Postgres unless an S3/R2 bucket is set up.
      UPLOADS_STORAGE: ${UPLOADS_STORAGE:-}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-}
      UPLOADS_QUOTA_MB: ${UPLOADS_QUOTA_MB:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-}
      # Caddy passes each visitor's address on in X-Forwarded-For (use cf-connecting-ip behind Cloudflare).
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER-x-forwarded-for}
      # Visitors' approximate location for the weather: "cloudflare" only behind Cloudflare (see the README).
      GEO_HEADERS: ${GEO_HEADERS:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workchop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: workchop
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workchop -d workchop"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Terminates HTTPS (browsers only allow camera and microphone over HTTPS) and gets the
  # certificate for DOMAIN automatically. DOMAIN must point at this server, ports 80/443 open.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # TURN relay (coturn). Needs UDP 3478 and 49160-49200 plus TCP 3478 open on the server,
  # and TURN_URL=turn:<DOMAIN>:3478 with TURN_USERNAME / TURN_CREDENTIAL in .env.
  turn:
    image: coturn/coturn:4.6
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command: >-
      -n --log-file=stdout --fingerprint --lt-cred-mech
      --realm=${DOMAIN:-workchop}
      --user=${TURN_USERNAME:-workchop}:${TURN_CREDENTIAL:-change-me}
      --listening-port=3478 --min-port=49160 --max-port=49200
      --external-ip=$$(detect-external-ip)

volumes:
  db-data:
  caddy-data:
  caddy-config:
