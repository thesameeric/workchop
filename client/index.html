<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5b6cff" />
    <meta name="description" content="Workchop — a 3D virtual office with proximity voice and video." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Workchop</title>
    <link rel="preload" href="/src/assets/hgi-subset.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved theme before the first paint (src/lib/theme.ts takes over from here).
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('workchop:theme');
        } catch (e) {}
        var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
